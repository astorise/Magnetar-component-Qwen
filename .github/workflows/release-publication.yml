name: Release Publication

# Publishes `magnetar-component-Qwen` to crates.io.
#
# `dry-run-publish` needs no credential and runs on every trigger.
# `real-publish` only runs on a manual `workflow_dispatch` (never off a tag
# push) and fails closed with an explicit message when `CARGO_REGISTRY_TOKEN`
# is not configured, matching the parent repository's
# `release-publication.yml` (MAG-06).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-publication-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dry-run-publish:
    name: release-publication / dry-run publish
    runs-on: ubuntu-latest
    steps:
      # The crate depends on `magnetar-runtime` through a relative path
      # (`../../magnetar-runtime`), so it is only buildable inside a checkout of
      # the parent repository with this repository placed at `components/qwen`.
      - name: Checkout parent Magnetar repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: astorise/Magnetar
          path: Magnetar
      - name: Checkout this crate at components/qwen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: Magnetar/components/qwen
      - name: Install pinned Rust toolchain
        working-directory: Magnetar/components/qwen
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: Magnetar/components/qwen
      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: Magnetar/components/qwen
        run: |
          version="$(cargo metadata --locked --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match magnetar-component-Qwen version $version" >&2
            exit 1
          fi
      - name: cargo publish --dry-run (no credential required)
        working-directory: Magnetar/components/qwen
        run: cargo publish --locked --dry-run

  real-publish:
    name: release-publication / cargo publish (real)
    runs-on: ubuntu-latest
    needs: [dry-run-publish]
    if: github.event_name == 'workflow_dispatch'
    environment: release
    steps:
      # The crate depends on `magnetar-runtime` through a relative path
      # (`../../magnetar-runtime`), so it is only buildable inside a checkout of
      # the parent repository with this repository placed at `components/qwen`.
      - name: Checkout parent Magnetar repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: astorise/Magnetar
          path: Magnetar
      - name: Checkout this crate at components/qwen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: Magnetar/components/qwen
      - name: Install pinned Rust toolchain
        working-directory: Magnetar/components/qwen
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: Magnetar/components/qwen
      - name: Check tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: Magnetar/components/qwen
        run: |
          version="$(cargo metadata --locked --no-deps --format-version=1 | jq -r '.packages[0].version')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match magnetar-component-Qwen version $version" >&2
            exit 1
          fi
      - name: Check crates.io token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured as a repository secret (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi
      - name: cargo publish (real)
        working-directory: Magnetar/components/qwen
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
